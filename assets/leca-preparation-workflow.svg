<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1260" role="img" aria-labelledby="title desc">
<title id="title">Four-step LECA preparation sequence</title><desc id="desc">LECA is immersed in 40 percent sodium silicate solution for three days, brought to saturated surface-dry condition, sprayed with 5 percent PVA solution, and dried with warm air. The measured mass gain after impregnation was 11.98 percent.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8fbfa"/><stop offset="1" stop-color="#edf4f2"/></linearGradient><linearGradient id="clay" x2="1" y2="1"><stop stop-color="#dfb47b"/><stop offset="1" stop-color="#a96737"/></linearGradient><linearGradient id="coat" x2="1" y2="1"><stop stop-color="#6ab2a4"/><stop offset="1" stop-color="#27766d"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#203b40" flood-opacity=".08"/></filter></defs>
<rect width="1000" height="1260" rx="26" fill="url(#bg)"/>
<g font-family="Arial,sans-serif"><text x="52" y="65" fill="#1c4145" font-size="31" font-weight="700" letter-spacing="1">LECA PREPARATION</text><text x="52" y="102" fill="#60777a" font-size="20">Four steps to a coated healing-agent carrier</text>
<g filter="url(#sh)"><rect x="42" y="140" width="916" height="210" rx="20" fill="#fff" stroke="#d4e4df" stroke-width="2"/></g><g filter="url(#sh)"><rect x="42" y="378" width="916" height="210" rx="20" fill="#fff" stroke="#d4e4df" stroke-width="2"/></g><g filter="url(#sh)"><rect x="42" y="616" width="916" height="210" rx="20" fill="#fff" stroke="#d4e4df" stroke-width="2"/></g><g filter="url(#sh)"><rect x="42" y="854" width="916" height="210" rx="20" fill="#fff" stroke="#d4e4df" stroke-width="2"/></g>
<!-- Step 1: beaker -->
<g transform="translate(85 175)"><path d="M40 0h125l-8 130q-2 15-16 15H64q-14 0-16-15z" fill="#eaf3f3" stroke="#789a9c" stroke-width="5"/><path d="M48 56h109l-5 69q-1 11-12 11H66q-11 0-12-11z" fill="#c79a50" opacity=".8"/><path d="M40 0h125" stroke="#789a9c" stroke-width="7" stroke-linecap="round"/><g fill="url(#clay)" stroke="#8b5934" stroke-width="2"><ellipse cx="78" cy="100" rx="19" ry="16"/><ellipse cx="124" cy="110" rx="21" ry="17"/><ellipse cx="105" cy="75" rx="19" ry="15"/><ellipse cx="67" cy="65" rx="15" ry="13"/></g></g>
<g fill="#1d5352"><text x="300" y="198" font-size="27" font-weight="700">01 · Sodium silicate impregnation</text></g><g fill="#5d7376" font-size="21"><text x="300" y="239">Immerse porous LECA in a 40% sodium</text><text x="300" y="270">silicate solution for 3 days.</text></g>
<!-- Step 2: sieve -->
<g transform="translate(80 410)"><path d="M0 30q90 35 190 0l-19 100q-4 18-21 18H42q-17 0-21-18z" fill="#e7eeee" stroke="#789397" stroke-width="6"/><path d="M15 53q80 28 160 0" fill="none" stroke="#9eb3b2" stroke-width="5"/><g fill="url(#clay)" stroke="#8d603c" stroke-width="2"><ellipse cx="55" cy="85" rx="24" ry="20"/><ellipse cx="111" cy="98" rx="26" ry="21"/><ellipse cx="153" cy="75" rx="20" ry="17"/></g></g>
<text x="300" y="436" fill="#1d5352" font-size="27" font-weight="700">02 · Saturated surface-dry (SSD)</text><g fill="#5d7376" font-size="21"><text x="300" y="477">Bring the impregnated particles to SSD</text><text x="300" y="508">condition before applying the coating.</text></g>
<!-- Step 3: spray -->
<g transform="translate(80 650)"><path d="M65 0h100l-9 34H74z" fill="#263d42"/><rect x="91" y="32" width="49" height="30" rx="7" fill="#48656a"/><path d="M115 62v17" stroke="#48656a" stroke-width="7"/><g fill="#6bb5aa"><circle cx="72" cy="95" r="5"/><circle cx="104" cy="106" r="5"/><circle cx="139" cy="94" r="6"/><circle cx="171" cy="112" r="5"/></g><g fill="url(#clay)" stroke="#8c5935" stroke-width="2"><ellipse cx="63" cy="151" rx="29" ry="23"/><ellipse cx="130" cy="155" rx="31" ry="24"/><ellipse cx="190" cy="148" rx="27" ry="22"/></g><g fill="none" stroke="url(#coat)" stroke-width="6"><ellipse cx="63" cy="151" rx="31" ry="25"/><ellipse cx="130" cy="155" rx="33" ry="26"/><ellipse cx="190" cy="148" rx="29" ry="24"/></g></g>
<text x="300" y="674" fill="#1d5352" font-size="27" font-weight="700">03 · PVA surface coating</text><g fill="#5d7376" font-size="21"><text x="300" y="715">Spray a 5% polyvinyl alcohol (PVA)</text><text x="300" y="746">solution onto the impregnated particles.</text></g>
<!-- Step 4: warm air -->
<g transform="translate(83 905)"><path d="M54 0h130l-10 39H64z" fill="#263d42"/><rect x="91" y="38" width="58" height="27" rx="8" fill="#536d70"/><g fill="none" stroke="#d18c3c" stroke-width="5" stroke-linecap="round"><path d="M75 83q-16 17 0 33t0 33"/><path d="M119 83q-16 17 0 33t0 33"/><path d="M163 83q-16 17 0 33t0 33"/></g><g fill="url(#clay)" stroke="#8c5935" stroke-width="2"><ellipse cx="65" cy="176" rx="30" ry="24"/><ellipse cx="125" cy="178" rx="32" ry="25"/><ellipse cx="190" cy="170" rx="28" ry="22"/></g><g fill="none" stroke="url(#coat)" stroke-width="6"><ellipse cx="65" cy="176" rx="32" ry="26"/><ellipse cx="125" cy="178" rx="34" ry="27"/><ellipse cx="190" cy="170" rx="30" ry="24"/></g></g>
<text x="300" y="912" fill="#1d5352" font-size="27" font-weight="700">04 · Warm-air drying</text><g fill="#5d7376" font-size="21"><text x="300" y="953">Dry with warm air to form a protective</text><text x="300" y="984">polymer film around the carrier particles.</text></g>
<rect x="42" y="1120" width="916" height="92" rx="18" fill="#e2eeea"/><text x="75" y="1160" fill="#315f5b" font-size="20" font-weight="600">Mass gain after impregnation</text><text x="75" y="1190" fill="#60777a" font-size="16">Relative to initial dry mass · measured at SSD condition</text><text x="910" y="1185" text-anchor="end" fill="#1e615b" font-size="42" font-weight="700">11.98%</text></g></svg>