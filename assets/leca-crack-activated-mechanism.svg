<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="mt md">
<title id="mt">Proposed crack-activated healing mechanism</title><desc id="md">Three stages: sodium silicate stored in porous LECA beneath PVA coating, cracking damages the coating and releases the healing agent, and released sodium silicate may react with calcium hydroxide to promote secondary C-S-H formation in the crack.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8faf9"/><stop offset="1" stop-color="#eef4f2"/></linearGradient><linearGradient id="clay" x2="1" y2="1"><stop stop-color="#e0b783"/><stop offset="1" stop-color="#b77a4b"/></linearGradient><linearGradient id="coat" x2="1" y2="0"><stop stop-color="#75b8aa"/><stop offset="1" stop-color="#347f76"/></linearGradient><pattern id="matrix" width="34" height="30" patternUnits="userSpaceOnUse"><path d="M3 5l8-4 7 7-5 8-9-2zM23 17l7-4 5 7-4 8-9-2z" fill="#c5cdca" stroke="#9eaaa6" stroke-width="1.5"/></pattern><filter id="sh"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#243b40" flood-opacity=".09"/></filter></defs>
<rect width="1600" height="620" rx="26" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="56" y="62" font-size="30" font-weight="700" fill="#1e4145" letter-spacing="1.2">PROPOSED CRACK-ACTIVATED HEALING MECHANISM</text><text x="56" y="99" font-size="20" fill="#63797b">A porous carrier stores the agent; cracking may trigger its release into the cementitious matrix</text>
<g filter="url(#sh)"><rect x="48" y="135" width="470" height="405" rx="22" fill="#fff" stroke="#d4e4df" stroke-width="2"/></g><g filter="url(#sh)"><rect x="565" y="135" width="470" height="405" rx="22" fill="#fff" stroke="#d4e4df" stroke-width="2"/></g><g filter="url(#sh)"><rect x="1082" y="135" width="470" height="405" rx="22" fill="#fff" stroke="#d4e4df" stroke-width="2"/></g>
<g fill="#1e615b" font-size="26" font-weight="700"><text x="82" y="184">01 · Store</text><text x="599" y="184">02 · Release</text><text x="1116" y="184">03 · React &amp; seal</text></g><g fill="#60777a" font-size="17"><text x="82" y="215">Before cracking</text><text x="599" y="215">Crack intersects the coated particle</text><text x="1116" y="215">Within the crack region</text></g>
