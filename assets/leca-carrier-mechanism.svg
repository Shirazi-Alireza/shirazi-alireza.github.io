<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Proposed PVA-coated LECA healing mechanism</title><desc id="desc">Three stages: storage of sodium silicate in PVA-coated LECA; crack damage to the coating and release; possible reaction with calcium hydroxide to form secondary C-S-H. The mechanism is proposed, not a verified result.</desc><rect width="960" height="500" rx="18" fill="#f1f7f5"/><g font-family="Arial, sans-serif" fill="#183f45"><text x="32" y="42" font-size="25" font-weight="700">A reservoir activated by cracking</text><text x="32" y="72" font-size="17" fill="#486269">Proposed mechanism · sodium silicate-loaded LECA with a protective PVA coating</text></g><rect x="24" y="100" width="288" height="370" rx="13" fill="white" stroke="#c9ded8"/><text x="42" y="134" font-family="Arial" font-size="21" font-weight="700" fill="#215f57">01  Store</text><rect x="42" y="153" width="252" height="170" rx="8" fill="#e5e8e4"/><circle cx="168" cy="236" r="56" fill="#b6a082" stroke="#337f73" stroke-width="7"/><circle cx="143" cy="224" r="7" fill="#2f8394"/><circle cx="168" cy="208" r="7" fill="#2f8394"/><circle cx="195" cy="226" r="7" fill="#2f8394"/><circle cx="153" cy="257" r="7" fill="#2f8394"/><circle cx="189" cy="260" r="7" fill="#2f8394"/><circle cx="170" cy="236" r="7" fill="#2f8394"/><text x="42" y="359" font-family="Arial" font-size="17" fill="#334f55">Porous LECA stores</text><text x="42" y="386" font-family="Arial" font-size="17" fill="#334f55">the sodium silicate solution.</text><text x="42" y="413" font-family="Arial" font-size="17" fill="#334f55">PVA limits premature leaching.</text><path d="M314 239h19m-7-6 7 6-7 6" fill="none" stroke="#377f73" stroke-width="3"/><rect x="336" y="100" width="288" height="370" rx="13" fill="white" stroke="#c9ded8"/><text x="354" y="134" font-family="Arial" font-size="21" font-weight="700" fill="#215f57">02  Release</text><rect x="354" y="153" width="252" height="170" rx="8" fill="#e5e8e4"/><circle cx="480" cy="236" r="56" fill="#b6a082" stroke="#337f73" stroke-width="7"/><circle cx="455" cy="224" r="7" fill="#2f8394"/><circle cx="480" cy="208" r="7" fill="#2f8394"/><circle cx="507" cy="226" r="7" fill="#2f8394"/><circle cx="465" cy="257" r="7" fill="#2f8394"/><circle cx="501" cy="260" r="7" fill="#2f8394"/><circle cx="482" cy="236" r="7" fill="#2f8394"/><path d="M566 153l-35 40 15 27-28 28 37 31-10 44" fill="none" stroke="#253a40" stroke-width="5"/><path d="M525 204l11 34-10 28" fill="none" stroke="#e5e8e4" stroke-width="11"/><circle cx="538" cy="238" r="5" fill="#2f8394"/><circle cx="550" cy="253" r="5" fill="#2f8394"/><circle cx="541" cy="274" r="5" fill="#2f8394"/><text x="354" y="359" font-family="Arial" font-size="17" fill="#334f55">Crack propagation may</text><text x="354" y="386" font-family="Arial" font-size="17" fill="#334f55">damage the PVA coating,</text><text x="354" y="413" font-family="Arial" font-size="17" fill="#334f55">allowing agent release.</text><path d="M626 239h19m-7-6 7 6-7 6" fill="none" stroke="#377f73" stroke-width="3"/><rect x="648" y="100" width="288" height="370" rx="13" fill="white" stroke="#c9ded8"/><text x="666" y="134" font-family="Arial" font-size="21" font-weight="700" fill="#215f57">03  React &amp; seal</text><rect x="666" y="153" width="252" height="170" rx="8" fill="#e5e8e4"/><circle cx="792" cy="236" r="56" fill="#b6a082" stroke="#337f73" stroke-width="7"/><circle cx="767" cy="224" r="7" fill="#2f8394"/><circle cx="792" cy="208" r="7" fill="#2f8394"/><circle cx="819" cy="226" r="7" fill="#2f8394"/><circle cx="777" cy="257" r="7" fill="#2f8394"/><circle cx="813" cy="260" r="7" fill="#2f8394"/><circle cx="794" cy="236" r="7" fill="#2f8394"/><path d="M878 153l-35 40 15 27-28 28 37 31-10 44" fill="none" stroke="#253a40" stroke-width="5"/><path d="M837 204l11 34-10 28" fill="none" stroke="#e5e8e4" stroke-width="11"/><circle cx="850" cy="238" r="5" fill="#2f8394"/><circle cx="862" cy="253" r="5" fill="#2f8394"/><circle cx="853" cy="274" r="5" fill="#2f8394"/><path d="M862 174l-13 22 12 26-23 27 25 30-8 28" fill="none" stroke="#bb914d" stroke-width="13" stroke-linejoin="round"/><text x="666" y="359" font-family="Arial" font-size="17" fill="#334f55">Sodium silicate + Ca(OH)₂</text><text x="666" y="386" font-family="Arial" font-size="17" fill="#334f55">may form secondary C–S–H</text><text x="666" y="413" font-family="Arial" font-size="17" fill="#334f55">within the crack region.</text><g font-family="Arial" font-size="13" fill="#486269"><text x="42" y="449">Blue: healing agent · Green: PVA</text><text x="666" y="449">Amber: proposed healing products</text></g></svg>